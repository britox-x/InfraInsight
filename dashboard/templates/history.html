<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Histórico - ANTENA INFRAINSIGHT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
        .container{max-width:1200px;margin:0 auto}
        .header{background:white;border-radius:20px;padding:25px;margin-bottom:25px}
        .logo-text h1{font-size:28px;color:#667eea}
        .nav-links{margin-top:20px;display:flex;gap:15px}
        .nav-link{padding:10px25px;background:#f5f5f5;border-radius:10px;text-decoration:none;color:#333}
        .nav-link.logout{background:#dc2626;color:white}
        .table-card{background:white;border-radius:20px;padding:25px;overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
        .risk-low{color:#10b981}
        .risk-medium{color:#f59e0b}
        .risk-high{color:#ef4444}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-text"><h1>🛰️ ANTENA INFRAINSIGHT</h1><p>Histórico de Scans</p></div>
        <div class="nav-links">
            <a href="/" class="nav-link">📊 Dashboard</a>
            <a href="/history" class="nav-link">📜 Histórico</a>
            <a href="/logout" class="nav-link logout">🚪 Sair</a>
        </div>
    </div>
    <div class="table-card">
        <h3>📊 Todos os Scans</h3>
        <tr><thead><tr><th>ID</th><th>Data</th><th>Dispositivos</th><th>Uso</th><th>Risco</th><th>Desconhecidos</th></tr></thead>
        <tbody>{% for s in scans %}<tr><td>{{ s.id }}</td><td>{{ s.timestamp[:19] }}</td><td>{{ s.ips_ativos }}</td><td>{{ s.uso }}%</td><td class="risk-{{ 'low' if s.risco_medio <= 2 else 'medium' if s.risco_medio <= 5 else 'high' }}">{{ s.risco_medio }}/10</td><td>{{ s.desconhecidos }}</td></tr>{% endfor %}</tbody>
    </table>
    </div>
</div>
</body>
</html>
