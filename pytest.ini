[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=1
    --cov=core
    --cov=dashboard
    --cov-report=html
    --cov-report=term
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take more than 5 seconds
    network: Tests that require network access
