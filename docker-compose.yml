version: '3.8'
services:
  infrainsight:
    build: .
    container_name: infrainsight
    restart: unless-stopped
    network_mode: host
    environment:
      INFRA_SCAN_SERVICES: ${INFRA_SCAN_SERVICES:-false}
      INFRA_SCAN_PORTS: ${INFRA_SCAN_PORTS:-}
      INFRA_CVE_LOOKUP: ${INFRA_CVE_LOOKUP:-false}
      INFRA_CVE_CACHE_TTL_HOURS: ${INFRA_CVE_CACHE_TTL_HOURS:-48}
      INFRA_CVE_MIN_CONFIDENCE: ${INFRA_CVE_MIN_CONFIDENCE:-70}
      INFRA_NVD_API_KEY: ${INFRA_NVD_API_KEY:-}
      INFRA_TELEGRAM_TOKEN: ${INFRA_TELEGRAM_TOKEN:-}
    volumes:
      - ./storage:/app/storage
      - ./reports:/app/reports
      - ./exports:/app/exports
      - ./config.json:/app/config.json:ro
    command: python scanner.py
